# dsCli 自测配置，格式按 xCode《老项目自动化测试标准》v1.0。规则说明见 docs/测试规范.md。
# 平台目前读取的是 xcode.json 的 test_cmd；本文件是完整配置，xCode 落地读取 xcode.yaml 后生效。
# 所有命令在仓库根目录执行。

version: 1

# 一次性准备：新副本第一次使用前执行
prepare:
  - pnpm -C code install --frozen-lockfile
  - pnpm -C code run build

# dsCli 没有数据库、缓存和常驻服务。隔离在每个用例内部完成（临时 DSH_HOME + 本机模型桩，见测试规范第 6 节），
# 所以沙箱是空操作
sandbox:
  up: node -e ""
  ready: node -e ""
  down: node -e ""
  timeout: 10

unit:
  - name: dsCli 单元测试
    run: node tests\run.mjs protocol unit

e2e:
  # 黑盒验收：本机模型桩，不联网，进全量测试
  - name: 验收测试
    run: node tests\run.mjs acceptance
    needs_sandbox: false
  # 真实模型 e2e 需要 DEEPSEEK_API_KEY、有费用、结果不稳定，不在这里跑，手动执行 node tests\run.mjs e2e

# 受保护的测试文件（测试规范第 8 节）。不要用 **/*.spec.ts，那会把上游 DSH 的测试也保护起来
test_globs:
  - "tests/**"
  - "xcode.json"
  - "xcode.yaml"
  - "code/packages/claude-compat/**/tests/**"
  - "code/packages/bundle/dscli/tests/**"
  - "code/**/*dscli*.spec.ts"

env:
  DEEPSEEK_API_KEY: 真实模型密钥，只有 e2e 用；全量测试不需要

